function tr(){vp.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`)}function zoom(f){scale=Math.max(.35,Math.min(2.7,scale*f));tr()}function fitMap(){scale=Math.min(1,(svg.clientWidth-20)/Math.max(960,svg.clientWidth),(svg.clientHeight-20)/Math.max(650,svg.clientHeight));tx=ty=8;tr()}search.oninput=update;flow.onchange=e=>{activeFlow=e.target.value;selected='';update()};checks.onchange=e=>{e.target.checked?types.add(e.target.value):types.delete(e.target.value);update()};zin.onclick=()=>zoom(1.2);zout.onclick=()=>zoom(.8);fit.onclick=fitMap;reset.onclick=()=>{selected=activeFlow='';flow.value=search.value='';update()};svg.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.12:.89)};let pan=null;svg.onpointerdown=e=>{if(e.target===svg)pan={x:e.clientX,y:e.clientY,tx,ty}};svg.onpointermove=e=>{if(pan){tx=pan.tx+e.clientX-pan.x;ty=pan.ty+e.clientY-pan.y;tr()}};svg.onpointerup=()=>pan=null;new ResizeObserver(()=>{render();fitMap()}).observe(svg);render();fitMap();
</script></body></html>
